[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
# HSK Chain mainnet runs Cancun (PUSH0/MCOPY/TSTORE ok, Osaka CLZ not activated).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Deploy script writes deployed addresses into the shared config.
fs_permissions = [{ access = "read-write", path = "../ABI" }]

[rpc_endpoints]
hsk = "https://mainnet.hsk.xyz"

[etherscan]
hsk = { key = "blockscout", url = "https://hashkey.blockscout.com/api", chain = 177 }
